{% extends "base.html" %}

{% block title %}样例数据运行{% endblock %}

{% block content %}
<section class="page-header">
  <div>
    <p class="eyebrow">流水线样例</p>
    <h1>样例数据运行</h1>
  </div>
</section>

<section class="panel narrow">
  <form class="stacked-form" method="post" action="/runs/fixture">
    <label>
      运行 ID
      <input name="run_id" value="web-after-close-001" required>
    </label>
    <label>
      简报日期
      <input name="report_date" type="date" value="{{ default_report_date }}" required>
    </label>
    <label>
      简报类型
      <select name="report_type" required>
        {% for report_type in report_types %}
          <option value="{{ report_type.value }}">{{ report_type|report_type_label }}</option>
        {% endfor %}
      </select>
    </label>
    <label>
      样例数据路径
      <input name="fixture_path" value="tests/fixtures/after_close_review_sources_zh.json" required>
    </label>
    <button type="submit">运行样例数据</button>
  </form>
</section>
{% endblock %}
